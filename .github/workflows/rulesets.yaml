name: Sync Repository Rulesets

on:
  push:
    branches:
      - main
    paths:
      - '.github/rulesets/**'

permissions:
  repository-projects: write
  contents: read
  administration: write

jobs:
  sync-ruleset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply or Update Ruleset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_RULESET_ID=$(gh api repos/${{ github.repository }}/rulesets \
            --jq '.[] | select(.name == "Protect Main Branch") | .id')

          if [ -z "$EXISTING_RULESET_ID" ]; then
            echo "Ruleset does not exist. Creating a new one..."
            gh api -X POST repos/${{ github.repository }}/rulesets \
              --input .github/rulesets/main-protection.json
          else
            echo "Ruleset already exists with ID: $EXISTING_RULESET_ID. Updating..."
            gh api -X PUT repos/${{ github.repository }}/rulesets/$EXISTING_RULESET_ID \
              --input .github/rulesets/main-protection.json
          fi
