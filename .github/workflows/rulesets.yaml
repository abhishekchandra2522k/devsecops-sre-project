name: Sync Repository Rulesets

on:
  push:
    branches:
      - main
    paths:
      - '.github/rulesets/**'

permissions:
  contents: read

jobs:
  sync-ruleset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply or Update Ruleset
        env:
          GH_TOKEN: ${{ secrets.RULESET_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RULESET_FILE: .github/rulesets/main-protection.json
        shell: bash
        run: |
          set -euo pipefail

          # Fail early if the ruleset configuration is missing.
          test -f "$RULESET_FILE"

          # Validate that the configuration is valid JSON.
          jq empty "$RULESET_FILE"

          # Find an existing ruleset by exact name, across all pages.
          EXISTING_RULESET_ID=$(
            gh api --paginate --slurp \
              "repos/$REPOSITORY/rulesets?per_page=100" \
              | jq -r \
                '[.[][] | select(.name == "Protect Main Branch") | .id]
                 | first // empty'
          )

          if [[ -z "$EXISTING_RULESET_ID" ]]; then
            echo "Ruleset not found. Creating it..."

            gh api \
              --method POST \
              "repos/$REPOSITORY/rulesets" \
              --input "$RULESET_FILE"
          else
            echo "Updating ruleset ID: $EXISTING_RULESET_ID"

            gh api \
              --method PUT \
              "repos/$REPOSITORY/rulesets/$EXISTING_RULESET_ID" \
              --input "$RULESET_FILE"
          fi

          echo "Ruleset synchronization completed successfully."
